<!DOCTYPE html>
<html>
<head>
	<title>My work</title>
</head>
	<body>
	<style>
	.font_2{
		background-color:darkblue;
		color:white;
		font-size:medium;
		}
	.font_1{
		background-color:black;
		color:yellow;
		font-size:large;
		}
		
	.My_Style{
		background-color:chocolate;
		color:white;
		text-decoration:underline;
		font size:medium;
		font-weight:bold;
		}
		
	
	
	</style>
	<h2 class="font_1">This h2 element is styled per class attribute .font_1</h2>
	<h3 class="font_2">This h3 elementis styled per class attribute .font_2</h3>
	<h4 class="font_1">Even though this is an h4 element.it is styled the same as the h2 element becuse we pointed to the class attribute .font_1 </h4>
	
	<p class="My_Style"> Style Element</p>
	</body>
	</html>
