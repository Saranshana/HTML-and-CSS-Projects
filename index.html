<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Creating effects with CSS</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">

        <!--Google fonts Link-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">


    </head>
    <body>

        <!--Navbar-->
        <nav class="nav-bar">
            <ul>
                <li>
                    <a href="#">Home</a>
                </li>
                <li class="drop">
                    <a href="#">Images</a>
                    <div class="rollover-menu">
                        <a href="#image1">Image 1</a>
                        <a href="#image2">Image 2</a>
                        <a href="#image3">Image 3</a>
                    </div>
                </li>
            </ul>
        </nav>

        <!--IMAGES-->
        <h1>Typography & Hover Challenge</h1>
        <p>Hover over the images below to see the custom CSS transformations in action.</p>
        <section>
            <!--Image 1-->
            <div class="image-container" id="image1">
                <img src="images/image1.jpg">
                <div class="overlay"></div>
            </div>

            <!--IMAGE 2-->
            <div class="image-container" id="image2">
                <img src="images/image2.jpg" class="zoom">
            </div>

            <!--IMAGE 3-->
            <div class="image-container" id="image3">
                <div class="circle">
               <img src="images/image3.jpg">
               </div>
            </div>

            <!--IMAGE 4-->
            <div class="gallery">
                <img src="images/beach.AVIF" class="image-card rotate">
            </div>
        </section>

        <!--FOOTER-->
        <footer>
            <div class="footer-text">
            <p>The Tech Academy &copy;</p>
            </div>
        </footer
        
       

    </body>
</html>
